[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-layout-benchmark"
version = "0.1.0"
description = "Adapter-based scene construction and deterministic evaluation harness."
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.22",
  "networkx>=3.4.2",
  "numpy>=1.26",
  "pillow>=10.0.0",
  "pyyaml>=6.0",
  "shapely>=2.0",
  "tqdm>=4.68.3",
]

[project.scripts]
layout-ddd-generate = "benchmark.api.generation:main"
layout-ddd-generate-nonrect = "benchmark.scene_generation.non_rectangular_multi_room.cli:main"
layout-ddd-generate-nonrect-agent = "benchmark.scene_generation.non_rectangular_agent.cli:main"
layout-ddd-agent-tool = "benchmark.scene_generation.non_rectangular_agent.tool_client:main"
layout-ddd-evaluate = "benchmark.api.evaluation:main"
layout-ddd-evaluate-sceneweaver-iterations = "benchmark.api.scene_weaver_iterations:main"
layout-ddd-compare-generation = "benchmark.generation_comparison.execution:main"
layout-ddd-controlled-pilot = "benchmark.generation_comparison.pilot:main"
layout-ddd-reevaluate-controlled = "benchmark.generation_comparison.reevaluation:main"
layout-ddd-evaluate-submission = "benchmark.api.submission:main"
layout-ddd-evaluate-game = "benchmark.game_scene.route:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
retrieval = [
    "numpy==2.5.0",
    "sentence-transformers==5.6.0",
    "transformers==5.13.0",
]
mesh-collision = [
    "trimesh>=4.5.0,<5",
    "python-fcl>=0.7.0,<0.8",
    "rtree>=1.4.0,<2",
]
browser = [
    "playwright>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["benchmark.legend", "benchmark.legend.*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"benchmark.game_scene" = ["*.js", "*.mjs"]
"benchmark._resources" = [
  "schemas/*.json",
  "schemas/multi_room/*.json",
  "schemas/non_rectangular/*.json",
  "schemas/non_rectangular_agent/*.json",
  "configs/evaluation/*.yaml",
  "configs/evaluation/*.json",
  "configs/grouping/*.yaml",
  "configs/game/*.yaml",
  "configs/game/*.json",
  "configs/game/counter_strike/*.yaml",
  "configs/retrieval/*.json",
  "configs/retrieval/golden/*.json",
]
"benchmark.scene_generation.multi_room" = ["prompts/*.txt"]
"benchmark.scene_generation.non_rectangular_multi_room" = ["prompts/*.txt"]
"benchmark.scene_generation.non_rectangular_agent" = ["prompts/*.txt"]

