[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-layout-benchmark"
version = "0.1.0"
description = "Adapter-based scene construction and deterministic evaluation harness."
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.22",
  "networkx>=3.4.2",
  "numpy>=1.26",
  "pillow>=10.0.0",
  "pyyaml>=6.0",
  "shapely>=2.0",
  "tqdm>=4.68.3",
]

[project.scripts]
layout-ddd-generate = "benchmark.api.generation:main"
layout-ddd-evaluate = "benchmark.api.evaluation:main"
layout-ddd-evaluate-submission = "benchmark.api.submission:main"
layout-ddd-evaluate-game = "benchmark.game_scene.route:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
retrieval = [
    "numpy==2.5.0",
    "sentence-transformers==5.6.0",
    "transformers==5.13.0",
]
mesh-collision = [
    "trimesh>=4.5.0,<5",
    "python-fcl>=0.7.0,<0.8",
    "rtree>=1.4.0,<2",
]
browser = [
    "playwright>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["benchmark.legend", "benchmark.legend.*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"benchmark.game_scene" = ["*.js", "*.mjs"]
"benchmark._resources" = [
  "schemas/*.json",
  "configs/evaluation/*.yaml",
  "configs/evaluation/*.json",
  "configs/grouping/*.yaml",
  "configs/game/*.yaml",
  "configs/game/*.json",
  "configs/game/counter_strike/*.yaml",
  "configs/retrieval/*.json",
  "configs/retrieval/golden/*.json",
]

[tool.pytest.ini_options]
testpaths = [
  "tests/test_adapter_io_contracts.py",
  "tests/test_asset_policy.py",
  "tests/test_asset_retriever.py",
  "tests/test_blender_mesh_fit.py",
  "tests/test_blender_renderer.py",
  "tests/test_browser_renderer.py",
  "tests/test_active_vlm_camera_adapter.py",
  "tests/test_camera_acquisition_cascade.py",
  "tests/test_camera_pose_modes.py",
  "tests/test_camera_dsl.py",
  "tests/test_camera_cal_scene_level_e0_contract.py",
  "tests/test_camera_cal_scene_level_leaf_runtime.py",
  "tests/test_camera_cal_scene_level_structure_e2.py",
  "tests/test_camera_cal_scene_level_structure_e3.py",
  "tests/test_camera_cal_scene_level_structure_e4.py",
  "tests/test_camera_cal_scene_level_structure_e5.py",
  "tests/test_catalog_materialization_blender.py",
  "tests/test_catalog_placement_adapter.py",
  "tests/test_current_namespace_boundaries.py",
  "tests/test_current_evaluation_profile.py",
  "tests/test_deterministic_local_camera_selector.py",
  "tests/test_evidence_contract.py",
  "tests/test_evaluation_campaign.py",
  "tests/test_functional_discovery.py",
  "tests/test_functional_planner_adapter.py",
  "tests/test_frozen_two_stage_generation_compatibility.py",
  "tests/test_generation_campaign_v2.py",
  "tests/test_generation_legacy_forwarding_d1.py",
  "tests/test_game_canonical_track.py",
  "tests/test_game_harness.py",
  "tests/test_game_mode.py",
  "tests/test_game_scene_export.py",
  "tests/test_generic_validity.py",
  "tests/test_grouping_algorithms.py",
  "tests/test_grouping_blind30_experiment.py",
  "tests/test_grouping_blind30_scoring.py",
  "tests/test_input_chain_boundaries.py",
  "tests/test_layout_json_adapter.py",
  "tests/test_materialization_consistency.py",
  "tests/test_nl_scene_mvp.py",
  "tests/test_oar_evaluator.py",
  "tests/test_openai_vlm_judge.py",
  "tests/test_object_mapping.py",
  "tests/test_object_grouping.py",
  "tests/test_oor_evaluator.py",
  "tests/test_p0b_adjudication.py",
  "tests/test_p0b_collision.py",
  "tests/test_p0b_collision_overlay.py",
  "tests/test_p0b_oob.py",
  "tests/test_p0b_support.py",
  "tests/test_p0a_reference_and_geometry.py",
  "tests/test_persisted_scoring_projection.py",
  "tests/test_relationship_mapper.py",
  "tests/test_scene_harness.py",
  "tests/test_sceneeval_hy4_local_runner.py",
  "tests/test_scene_generation_leaderboard_weights.py",
  "tests/test_select_first_publishable_scene_evaluations.py",
  "tests/test_scene_quality_interfaces.py",
  "tests/test_coarse_specification_interfaces.py",
  "tests/test_specification_contract.py",
  "tests/test_submission_api.py",
  "tests/test_submission_readiness_report.py",
  "tests/test_visual_style_spec.py",
  "tests/test_vlm_control_loop.py",
  "tests/test_vlm_evaluation_control_config.py",
]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
  "requires_blender: requires a validated external Blender runtime",
  "requires_git_history: requires pinned historical Git objects",
  "requires_loopback: opens a loopback HTTP server",
  "requires_local_data: requires frozen local datasets or assets",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
