model_list:
  - model_name: gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAPI_GPT_KEY
      api_base: os.environ/OPENAPI_BASE_URL_V1
      reasoning_effort: xhigh
      additional_drop_params:
        - output_config
        - temperature
    model_info:
      base_model: gpt-5.6-sol

litellm_settings:
  drop_params: true
  telemetry: false
  num_retries: 1
  request_timeout: 3000

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
